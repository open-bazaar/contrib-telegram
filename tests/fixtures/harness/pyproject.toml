[project]
name = "bcn-telegram-test-harness"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = [
    "bazaar-core>=0.3.0rc10,<0.4",
    "bazaar-contrib-audit>=0.3.0rc10,<0.4",
    "bazaar-contrib-config>=0.3.0rc10,<0.4",
    "bazaar-contrib-harness>=0.3.0rc10,<0.4",
    "blockbuster>=1.5.29,<1.6",
    "pydantic>=2.12.0",
]

[project.entry-points."bazaar_compute_node.contribs"]
test-harness-builder = "bcn_telegram_test_harness:harness_builder"
audit-journal = "bcn_telegram_test_harness:journal"
config-env-token = "bcn_telegram_test_harness:env_token"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
