name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.0'
      - name: Install
        run: uv sync --python 3.15 --prerelease allow
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Types
        run: uv run --no-sync pyright
      - name: Test
        run: uv run --no-sync pytest -q -m 'not e2e'
      - name: Build
        run: uv build --no-sources

  e2e:
    runs-on: ubuntu-24.04
    concurrency:
      group: telegram-e2e
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.0'
      - name: Install
        run: uv sync --python 3.15 --prerelease allow
      - name: Test
        env:
          PYTHONUNBUFFERED: '1'
          TELEGRAM_TEST_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
          TELEGRAM_DRIVER_BOT_TOKEN: ${{ secrets.TELEGRAM_DRIVER_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ vars.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_TEST_TOPIC_ID: ${{ vars.TELEGRAM_TEST_TOPIC_ID }}
        run: |
          mkdir -p .artifacts
          uv run --no-sync pytest -vv -s -m e2e --basetemp .artifacts/e2e
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: telegram-e2e
          path: |
            .artifacts/e2e/**/*.log
            .artifacts/e2e/**/audit.jsonl
          include-hidden-files: true
          if-no-files-found: warn
